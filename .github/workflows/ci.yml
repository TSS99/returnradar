name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Backend, MCP and Python lint
        run: |
          python -m pytest -q
          ruff check .
          ruff format --check .
          bandit -r backend/app mcp_server -q
          python -m scripts.check_public_files
          pip-audit
          python -m scripts.mcp_smoke
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run format:check
          npm audit --audit-level=low
          npx playwright install --with-deps chromium
      - name: Real browser journeys
        working-directory: frontend
        env:
          RETURNRADAR_PYTHON: python
        run: npm run test:e2e
      - name: Package local plugin
        run: python -m scripts.package_plugin
