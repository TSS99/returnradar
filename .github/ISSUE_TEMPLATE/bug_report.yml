name: Bug report
description: Report a problem using synthetic data only
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Never attach real invoices, databases, personal information or credentials. For security vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and reproducible steps with fictional data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized output
      description: Remove paths, identifiers and any private information.
